<!doctype html><html lang="fr" data-warlike-app="warlike-chat"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike Téléphonie</title><link rel="stylesheet" href="/design-system/warlike-foundation.css"><link rel="stylesheet" href="/calls.css"></head><body><header><a href="/">WarLike Chat</a><strong>Téléphonie & réunions</strong><span id="account">Vérification de session…</span></header><main id="desk" hidden><section><h1>Appels</h1><label for="number">Numéro ou extension</label><input id="number" type="tel" autocomplete="off" maxlength="25" placeholder="+33 …"><div id="keys"></div><button id="erase">Effacer</button><button id="call">Appeler</button><p id="phoneStatus" role="status"></p></section><section><h1>Préparation de réunion</h1><video id="preview" autoplay muted playsinline></video><div><button id="camera">Tester caméra et micro</button><button id="stop">Arrêter</button></div><p id="mediaStatus" role="status">Prévisualisation locale uniquement. Aucun appel distant n’est établi.</p></section><section><h1>Appel WarLike</h1><label>Ma disponibilité <select id="availability"><option value="available">Disponible</option><option value="busy">Occupé</option><option value="away">Absent</option><option value="meeting">En réunion</option><option value="dnd">Ne pas déranger</option></select></label><select id="peer"></select><button id="audioCall">Audio</button><button id="videoCall">Vidéo</button><p id="callState" role="status"></p><button id="acceptCall" hidden>Accepter</button><button id="declineCall" hidden>Refuser</button><button id="endCall" disabled>Raccrocher</button><div><button id="muteCall" disabled>Couper le micro</button><button id="toggleVideo" disabled>Couper la caméra</button><output id="duration">00:00</output></div><label>Microphone <select id="micDevice"><option value="">Par défaut</option></select></label><label>Caméra <select id="cameraDevice"><option value="">Par défaut</option></select></label><video id="localMedia" autoplay muted playsinline></video><video id="remoteMedia" autoplay playsinline controls></video></section><section><h1>Historique des appels</h1><button id="soundEnable">Activer les sonneries</button><label>Filtrer <select id="historyFilter"><option value="all">Tous</option><option value="missed">Manqués</option><option value="incoming">Entrants</option><option value="outgoing">Sortants</option></select></label><ol id="callHistory"></ol></section></main><script type="module" src="/calls.js"></script><script type="module" src="/call-media.js"></script></body></html>
