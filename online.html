<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike Chat — En ligne</title><link rel="stylesheet" href="./style.css"><style>body{padding:24px}.online{max-width:940px;margin:auto}.online input,.online button,.online select{padding:12px;margin:5px;font:inherit}.online input,.online select{color:#f2f7fa;background:#17242b;border:1px solid #53616c;border-radius:8px}.online button{cursor:pointer}#feed{height:50vh;overflow:auto;border:1px solid #52606c;padding:16px;border-radius:12px}#feed article{padding:12px;border-bottom:1px solid #4e5a63}#feedback{min-height:25px;color:#ffd29a}form{margin:12px 0}[hidden]{display:none!important}.hint{color:#b2c5ce}.delete{font-size:12px}#message{width:min(70%,600px)}</style></head><body><main class="online"><a href="./local.html">← Mode local</a><h1>WarLike Chat · En ligne</h1><p class="hint">Salons partagés · Un compte WarLike · Messages conservés</p><p id="feedback" role="status">Connexion au service…</p><section id="auth"><form id="login"><h2>Connexion WarLike</h2><label>Identifiant <input name="username" autocomplete="username" required></label><label>Mot de passe <input type="password" name="password" autocomplete="current-password" required></label><button>Se connecter</button></form><p class="hint">Première connexion ? <a href="https://warlike-server.pages.dev/connexion">Personnalise ton compte sur WarLike Server</a>.</p></section><section id="chat" hidden><p>Connecté : <b id="who"></b> <button id="logout">Déconnexion</button></p><label>Salon <select id="room"></select></label><div id="feed" role="log" aria-live="polite"></div><form id="sendForm"><label for="message">Message</label><input id="message" maxlength="2000" required placeholder="Écris un message…"><button>Envoyer</button></form><small>Actualisation toutes les 3 secondes · Messages partagés avec les membres connectés</small></section></main><script type="module" src="./online.js"></script></body></html>
