<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike Chat — En ligne</title><link rel="stylesheet" href="./style.css"><style>body{padding:24px} .online{max-width:940px;margin:auto} .online input,.online button{padding:12px;margin:5px} .online input{color:inherit;background:#17242b;border:1px solid #53616c;border-radius:8px} .online button{cursor:pointer} #feed{height:50vh;overflow:auto;border:1px solid #52606c;padding:16px;border-radius:12px} #feed article{padding:12px;border-bottom:1px solid #4e5a63} #feedback{min-height:25px;color:#ffd29a} form{margin:12px 0} [hidden]{display:none!important}</style></head><body><main class="online"><a href="./index.html">← Mode local</a><h1>WarLike Chat · Serveur</h1><p id="feedback" role="status">Connexion au service…</p><section id="auth"><form id="login"><h2>Connexion</h2><input name="username" placeholder="Identifiant" autocomplete="username" required><input type="password" name="password" placeholder="Mot de passe" autocomplete="current-password" required><button>Connexion</button></form><form id="register"><h2>Inscription</h2><input name="username" placeholder="Identifiant (3–24)" minlength="3" maxlength="24" required><input name="password" type="password" minlength="12" placeholder="Mot de passe (12+)" autocomplete="new-password" required><button>Créer le compte</button></form></section><section id="chat" hidden><p>Connecté : <b id="who"></b> <button id="logout">Déconnexion</button></p><label>Salon <select id="room"></select></label><div id="feed" role="log" aria-live="polite"></div><form id="sendForm"><input id="message" maxlength="2000" required placeholder="Message…"><button>Envoyer</button></form><small>Actualisation toutes les 3 secondes · Messages conservés sur le serveur</small></section></main><script type="module" src="./online.js"></script></body></html>
